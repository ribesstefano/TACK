# Molecule
mol_features: "descriptors"
use_relevant_descriptors: false

# POI (target protein)
poi_features: "name"

# E3 ligase (recruiter)
ligase_features: "name"

# Cell line
cell_features: "description"
cell_line_col: "Cell_Line_ID"

# Assay context
use_assay_type_encoding: true
use_treatment_time: true

# Categorical encoding
categorical_encoding: "embedding"

# Labels
normalize_labels: false
standardize_labels: false
impute_labels: false
