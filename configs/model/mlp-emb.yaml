model_type: mlp
model_config:
    learning_rate: 0.001
    hidden_dim: 256
    mlp_depth: 2
    head_depth: 2
    dropout: 0.1
    head_dropout: 0.1
    task_type: point
    lr_scheduler_type: cosine
    warmup_ratio: 0.05
    num_cycles: 10
    categorical_embedding_dim: 8
training_config:
    max_epochs: 200
    patience: 5
