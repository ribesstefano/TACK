[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tackai"
version = "1.0.0"
description = "TACK: A statistical evaluation of degradation activity on a novel TArgeting Chimeras Knowledge dataset"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Stefano Ribes", email = "ribes@chalmers.se" },
    { name = "Nils Dunlop", email = "nilsdu@chalmers.se" },
]
requires-python = ">=3.11"
dependencies = [
    # Deep learning
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "lightning>=2.0.0",
    "lightning-uq-box>=0.2.0",
    "laplace-torch==0.2.2.2",
    "curvlinops-for-pytorch==2.0.1",
    "torchmetrics>=1.0.0",
    # NLP / embeddings
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "datasets>=3.0.0",
    # Chemistry
    "rdkit>=2024.0.0",
    "useful-rdkit-utils>=0.90",
    # Classical ML
    "scikit-learn>=1.5.0,<1.7.0",
    "xgboost>=2.0.0",
    "optuna>=4.0.0",
    "optuna-integration>=4.0.0",
    "imbalanced-learn>=0.12.0",
    # Data / numerics
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "h5py>=3.10.0",
    "umap-learn>=0.5.5",
    # Statistics
    "pingouin>=0.5.4",
    "scikit-posthocs>=0.9.0",
    # Bioinformatics
    "biopython>=1.80",
    # Utilities
    "beautifulsoup4>=4.12.0",
    "thefuzz>=0.22.0",
    "rapidfuzz>=3.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "gdown>=5.0.0",
    "requests>=2.31.0",
    "colorlog>=6.8.0",
    "tabulate>=0.9.0",
    "tensorboard>=2.20.0",
    # Configuration / CLI
    "hydra-core>=1.3.0",
    # Statistical model comparison (omnibus ranking + critical-difference diagrams)
    "autorank>=1.2.0",
]

[project.optional-dependencies]
dev = [
    # Plotting
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "shap>=0.45.0",
    # Notebooks
    "jupyter>=1.1.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "notebook>=7.0.0",
    # Demo / app
    "gradio>=6.0.0",
    # Testing
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/ribesstefano/TACK"
Repository = "https://github.com/ribesstefano/TACK"

[project.scripts]
tack = "tackai.cli:main"
# Hydra multirun sweep launcher (supports `-m model=a,b data=c,d task=...`).
# `tack train` remains the single-run convenience path (Hydra compose API).
tack-sweep = "tackai.train_app:main_hydra"

[tool.hatch.build.targets.wheel]
packages = ["tackai", "tack_dataset"]

[tool.pytest.ini_options]
testpaths = ["test"]

[dependency-groups]
dev = [
    "huggingface-hub>=1.13.0",
    "ipython>=9.13.0",
]
