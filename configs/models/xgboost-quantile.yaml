model_config:
    objective: "reg:quantileerror"
    base_score: 0.0        # Since we scaled to mean=0, start at 0
    tree_method: "hist"
    learning_rate: 0.01    # Drastically lower learning rate
    n_estimators: 2000     # Needs more rounds because LR is low
    # Subsampling (Bagging)
    subsample: 0.60        # Train on random 60% chunks
    colsample_bytree: 0.80 # Random 80% of features
    # Force leaves to have significant weight
    min_child_weight: 20   # Increased from 10 to 20   
    # Constraints
    max_depth: 5
    gamma: 1.5             # Original: 1.1
    reg_alpha: 1.5
    reg_lambda: 1.5
    n_jobs: 10
    seed: 42
training_config:
    num_boost_round: 2000
    early_stopping_rounds: 30
