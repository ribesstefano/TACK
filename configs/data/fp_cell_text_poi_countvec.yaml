# Molecule
mol_features: "fingerprint+descriptors"
fp_size: 512
radius: 16
use_relevant_descriptors: false

# POI (target protein)
poi_features: "sequence"

# E3 ligase (recruiter)
ligase_features: "name"

# Cell line
cell_features: "description"
cell_line_col: "Cell_Line_ID"

# Assay context
use_assay_type_encoding: true
use_treatment_time: true

# Categorical encoding
categorical_encoding: "minmax"

# Labels
normalize_labels: true
standardize_labels: false
impute_labels: true
